<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home — Raspberry Pi Monitoring System</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (_) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="/static/style.css?v=system-1">
  <script src="/static/app.js?v=system-1" defer></script>
</head>
<body>
  <a class="skip-link" href="#environment">Skip to telemetry</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-section">
        <div class="brand-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16v12H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 6V3m5 3V3m5 3V3M7 18v3m5-3v3m5-3v3M4 9H1m3 6H1m19-6h3m-3 6h3" stroke="currentColor" stroke-width="1.8"/></svg>
        </div>
        <h1 class="brand-title">Smart Home <span class="brand-subtitle mono">Raspberry Pi 5</span></h1>
      </div>
      <div class="header-meta mono">
        <time id="local-clock">—</time>
        <span class="text-secondary" title="Raspberry Pi system uptime">Uptime <strong id="system-uptime">—</strong></span>
        <span class="chip" id="connection-badge">API: connecting</span>
        <span class="status-pill" id="overall-status" data-state="unknown" title="Host and dependency health"><span class="glow-dot" aria-hidden="true"></span><span id="overall-status-text">CONNECTING</span></span>
        <button class="theme-toggle mono" id="theme-toggle" type="button" aria-label="Switch to light theme">☀ Light</button>
      </div>
    </div>
    <nav class="top-nav mono" aria-label="Dashboard sections">
      <a href="#environment">Environment</a><a href="#history">History</a><a href="#motion">Motion</a><a href="#automation">Automation</a><a href="#devices">Devices</a>
    </nav>
  </header>

  <main class="dashboard-grid" id="dashboard">
    <section class="environment-section full-width" id="environment" aria-labelledby="environment-title">
      <div class="overview-strip mono">
        <h2 id="environment-title" class="section-title">Current Environment <span class="text-secondary">/ Room 1</span></h2>
        <div class="strip-meta"><span>Device <strong id="device-id">—</strong></span><span>Updated <strong id="node-last-sync">—</strong></span><span id="room-status" data-state="unknown">CONNECTING</span></div>
      </div>
      <div class="sensor-grid" id="sensor-grid"></div>
    </section>

    <section class="analysis-grid full-width" aria-label="Analysis">
      <div class="module-host" id="history-host" data-module="history"></div>
      <aside class="analysis-sidebar" aria-label="Weather, analysis and system status">
        <div class="module-host" data-module="weather"></div>
        <div class="module-host" data-module="ai"></div>
        <div class="module-host" data-module="system"></div>
      </aside>
    </section>
    <div class="module-host full-width" data-module="motion"></div>
    <div class="module-host full-width" data-module="automation"></div>
    <section class="device-grid full-width" id="devices" aria-label="Devices">
      <div class="module-host full-width" data-module="camera"></div>
      <div class="module-host full-width" data-module="zigbee"></div>
    </section>
    <noscript><p class="empty-state">Enable JavaScript to load live telemetry and monitoring modules.</p></noscript>
  </main>

  <!-- Every module uses this shell. Content templates provide only their body. -->
  <template id="card-template">
    <article class="console-card">
      <header class="card-header">
        <div class="card-heading"><h2 class="card-title"></h2><p class="card-subtitle mono"></p></div>
        <span class="chip mono card-badge"></span>
      </header>
      <div class="card-body"></div>
      <footer class="card-footer mono"></footer>
    </article>
  </template>
  <template id="sensor-body">
    <div class="metric-row"><div class="metric-value mono"><span data-field="value">—</span><span class="metric-unit" data-field="unit"></span></div><span class="delta-badge mono" data-field="trend">—</span></div>
  </template>
  <template id="sensor-footer">
    <dl class="sensor-stats"><div><dt>Minimum</dt><dd data-field="min">—</dd></div><div><dt>Maximum</dt><dd data-field="max">—</dd></div><div><dt>Average</dt><dd data-field="avg">—</dd></div><div><dt>Updated</dt><dd data-field="updated">—</dd></div></dl>
  </template>

  <template id="history-body">
    <div class="chart-controls">
      <div class="segmented-control" role="group" aria-label="Chart metric">
        <button class="segmented-btn chart-metric-btn active" type="button" data-metric="temperature" aria-pressed="true">Temp</button>
        <button class="segmented-btn chart-metric-btn" type="button" data-metric="humidity" aria-pressed="false">Humidity</button>
        <button class="segmented-btn chart-metric-btn" type="button" data-metric="pressure" aria-pressed="false">Pressure</button>
      </div>
      <div class="segmented-control" role="group" aria-label="Chart range">
        <button class="segmented-btn chart-range-btn active" type="button" data-hours="1" aria-pressed="true">1H</button>
        <button class="segmented-btn chart-range-btn" type="button" data-hours="6" aria-pressed="false">6H</button>
        <button class="segmented-btn chart-range-btn" type="button" data-hours="24" aria-pressed="false">24H</button>
        <button class="segmented-btn" type="button" disabled title="Planned: seven-day history">7D</button>
        <button class="segmented-btn" type="button" disabled title="Planned: thirty-day history">30D</button>
      </div>
      <div class="button-group"><button class="action-btn mono" id="export-csv" type="button" disabled>Export CSV</button><button class="action-btn mono" id="chart-fullscreen" type="button" aria-pressed="false">Fullscreen</button></div>
    </div>
    <div class="chart-container" id="chartWrapper">
      <canvas id="tempCanvas" role="img" aria-label="Temperature history chart"></canvas>
      <div class="chart-tooltip mono" id="tooltip"><div class="text-secondary">Timestamp: <span id="tt-time">—</span></div><div class="val" id="tt-val">—</div></div>
    </div>
  </template>
  <template id="weather-body">
    <div class="weather-summary"><div><div class="weather-location mono" id="weather-location">—</div><div class="weather-feels" id="weather-feels">Feels like —</div></div><div class="weather-value mono"><span id="weather-icon" aria-hidden="true">—</span><span id="weather-temp">—</span><span class="text-secondary">°C</span></div></div>
    <dl class="detail-grid mono"><div><dt>Humidity</dt><dd id="weather-humidity">—</dd></div><div><dt>Pressure</dt><dd id="weather-pressure">—</dd></div><div><dt>Wind</dt><dd id="weather-wind">—</dd></div><div><dt>Rain</dt><dd id="weather-rain">—</dd></div></dl>
  </template>
  <template id="ai-body">
    <div class="ai-summary"><div><div class="detail-label mono">Comfort</div><div class="ai-score mono"><span id="ai-score">—</span><small> / 100</small></div></div><div><div class="detail-label mono">Environment status</div><div class="ai-status mono" id="ai-status">COLLECTING</div></div></div>
    <h3 class="detail-label mono">Insights &amp; recommendations</h3>
    <ul class="ai-messages" id="ai-messages"><li>Collecting data for analysis…</li></ul>
    <div class="ai-forecast"><div><span class="detail-label mono">30 min forecast</span><div class="ai-forecast-value mono" id="ai-forecast">—</div></div><span class="ai-detail mono" id="ai-trend">Trend: collecting data</span></div>
  </template>
  <template id="system-body">
    <dl class="detail-grid mono"><div><dt>CPU usage</dt><dd id="system-cpu" data-state="unknown">—</dd></div><div><dt>RAM usage</dt><dd id="system-memory" data-state="unknown">—</dd></div><div><dt>Disk usage</dt><dd id="system-disk" data-state="unknown">—</dd></div><div><dt>CPU temp</dt><dd id="system-temperature" data-state="unknown">—</dd></div></dl>
    <dl class="status-list mono"><div><dt>Uptime</dt><dd id="system-card-uptime">—</dd></div><div><dt>Host</dt><dd id="system-hostname">—</dd></div><div><dt>MQTT</dt><dd id="system-mqtt" data-state="unknown">Unknown</dd></div><div><dt>Database</dt><dd id="system-database" data-state="unknown">Unknown</dd></div><div><dt>Internet</dt><dd id="system-internet" data-state="unknown">Unknown</dd></div><div><dt>ESP32</dt><dd id="system-esp32" data-state="unknown">Unknown</dd></div><div><dt>API</dt><dd id="system-api" data-state="unknown">Unknown</dd></div><div><dt>Zigbee coordinator</dt><dd id="system-zigbee" data-state="unknown">Unknown</dd></div></dl>
  </template>
  <template id="motion-body">
    <p class="empty-state">Module not yet installed.</p>
    <dl class="module-fields mono"><div><dt>PIR</dt><dd>Not installed</dd></div><div><dt>Wi-Fi CSI</dt><dd>Not installed</dd></div><div><dt>Camera</dt><dd>Not installed</dd></div><div><dt>Last motion</dt><dd>—</dd></div><div><dt>Today's events</dt><dd>—</dd></div></dl>
    <div class="timeline"><h3 class="detail-label mono">Timeline / Recent events</h3><p class="text-secondary">Motion events will appear here when a sensor is connected.</p></div>
  </template>
  <template id="automation-body">
    <p class="empty-state">Module not yet installed.</p>
    <dl class="module-fields mono"><div><dt>Lights</dt><dd>Not installed</dd></div><div><dt>Night mode</dt><dd>Not installed</dd></div><div><dt>Presence simulation</dt><dd>Not installed</dd></div><div><dt>Heating</dt><dd>Not installed</dd></div></dl>
  </template>
  <template id="camera-body">
    <div class="camera-layout"><div class="snapshot-placeholder"><span class="detail-label mono">Latest snapshot</span><span>Module not yet installed.</span></div><div><dl class="status-list mono"><div><dt>Snapshot time</dt><dd>—</dd></div><div><dt>Motion detection</dt><dd>Not installed</dd></div></dl><button class="action-btn mono" type="button" disabled title="Available when a camera is installed">Take Snapshot</button></div></div>
  </template>
  <template id="zigbee-body">
    <p class="empty-state">Module not yet installed.</p>
    <dl class="module-fields mono"><div><dt>Coordinator</dt><dd>Not installed</dd></div><div><dt>Devices</dt><dd>—</dd></div><div><dt>Bulbs</dt><dd>—</dd></div><div><dt>Switches</dt><dd>—</dd></div><div><dt>Sensors</dt><dd>—</dd></div><div><dt>Signal quality</dt><dd>—</dd></div></dl>
    <button class="action-btn mono" type="button" disabled title="Available when a Zigbee coordinator is installed">Network Map</button>
  </template>
  <footer class="site-footer"><div class="footer-inner mono"><strong>Smart Home Monitoring</strong><span>Room 1 · Live sensor data via FastAPI</span></div></footer>
</body>
</html>
